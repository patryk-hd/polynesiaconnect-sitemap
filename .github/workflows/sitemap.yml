name: Sitemap

on:
  schedule:
    # Monday 08:00 Tahiti (18:00 UTC), after the Monday agenda and jobs routines; once a week since November 2026
    # (each run downloads ~1,350 pages from the site, which has a 10 GB monthly bandwidth cap)
    - cron: "0 18 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl www.polynesiaconnect.com
        run: python3 crawl.py "${SITEMAP_BASE}"
        env:
          SITEMAP_BASE: ${{ vars.SITEMAP_BASE || 'https://patryk-hd.github.io/polynesiaconnect-sitemap' }}
      - name: Publish
        run: |
          git config user.name "polynesiaconnect-sitemap[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state.json changes.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "Sitemap $(date -u +%Y-%m-%d)"
          git push -q
      - name: Copy to www.polynesiaconnect.com/sitemap.xml
        # the site's "PC Sitemap Sync" widget downloads this commit's files into filedata/cache/sitemaps/
        env:
          SYNC_TOKEN: ${{ secrets.SITEMAP_SYNC_TOKEN }}
        run: |
          sha=$(git rev-parse HEAD)
          out=$(curl -sS --max-time 170 -A "PolynesiaConnectSitemap/1.0" "https://www.polynesiaconnect.com/pc-sitemap-sync?token=${SYNC_TOKEN}&sha=${sha}")
          echo "$out" | grep -o "PC sitemap sync: [^<]*" || { echo "sync widget did not answer"; exit 1; }
          # success only if every file was written (e.g. "7/7 files written")
          re='sync: ([0-9]+)/([0-9]+) files written'
          if [[ "$out" =~ $re ]] && [ "${BASH_REMATCH[1]}" = "${BASH_REMATCH[2]}" ] && [ "${BASH_REMATCH[1]}" -gt 0 ]; then exit 0; fi
          exit 1
      - name: Notify Bing (IndexNow)
        # new and changed pages of this run; the key is served by the site at /indexnow-key
        # runs even when the copy step failed: Bing reads the pages themselves, not our sitemap copy
        if: ${{ !cancelled() && vars.INDEXNOW_KEY != '' }}
        env:
          KEY: ${{ vars.INDEXNOW_KEY }}
        run: |
          live=$(curl -sS --max-time 60 -A "PolynesiaConnectSitemap/1.0" https://www.polynesiaconnect.com/indexnow-key | tr -d '[:space:]')
          if [ "$live" != "$KEY" ]; then echo "key page not answering the key yet — skipped"; exit 0; fi
          python3 - <<'PY'
          import json, os, urllib.request
          ch = json.load(open("changes.json"))
          paths = ch["added"] + ch["changed"]
          if os.path.exists("indexnow-all.flag"):
              paths = list(json.load(open("state.json")))
          urls = ["https://www.polynesiaconnect.com" + p for p in paths][:10000]
          if not urls:
              print("nothing new to notify"); raise SystemExit
          body = json.dumps({"host": "www.polynesiaconnect.com", "key": os.environ["KEY"],
                             "keyLocation": "https://www.polynesiaconnect.com/indexnow-key", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req, timeout=60) as r:
              print("IndexNow:", r.status, len(urls), "URLs")
          PY
          if [ -f indexnow-all.flag ]; then
            git rm -q indexnow-all.flag && git commit -q -m "IndexNow: first full submission done" && git push -q
          fi
